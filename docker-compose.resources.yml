name: fizz-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: fizz_postgres_dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fizz_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fizz_server

  minio:
    image: minio/minio:latest
    container_name: fizz_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data
    networks:
      - fizz_server

  minio-create-bucket:
    image: minio/mc:latest
    container_name: fizz_minio_bootstrap_dev
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "${MINIO_ROOT_USER:-minioadmin}" "${MINIO_ROOT_PASSWORD:-minioadmin}"; do
          echo "waiting for minio..."
          sleep 1
        done
        mc mb --ignore-existing "local/${LITESTREAM_S3_BUCKET:-fizz-workflows-dev}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      LITESTREAM_S3_BUCKET: ${LITESTREAM_S3_BUCKET:-fizz-workflows-dev}
    networks:
      - fizz_server

  adminer:
    image: adminer
    container_name: fizz_adminer_dev
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - fizz_server
    depends_on:
      - postgres


volumes:
  postgres_dev_data:
  minio_dev_data:


networks:
  fizz_server:
    driver: bridge
